<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayuno y Marcha | Ministerio Profético HSV</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
            line-height: 1.6;
        }

        .flag-bg {
            background-color: #002D62; /* Azul profundo */
            background-image: linear-gradient(rgba(0, 45, 98, 0.85), rgba(0, 45, 98, 0.85)), 
                              url('IMG-20260817-WA0029.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #CF142B; /* Rojo patriótico */
        }

        h1 {
            color: #FFD700; /* Dorado para destacar */
            text-transform: uppercase;
        }

        .info-box {
            margin: 20px 0;
            padding: 15px;
            border-left: 5px solid #FFD700;
            background: rgba(255, 255, 255, 0.1);
        }

        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="flag-bg">
        <div class="container">
            <h1>Ministerio Profético HSV</h1>
            <p>Bienvenidos al sitio oficial del Ayuno y Marcha.</p>

            <div class="info-box">
                <h2>Programación</h2>
                <p>Únete a nosotros en este tiempo de oración y unidad.</p>
                <!-- Aquí puedes añadir tus fechas y detalles -->
            </div>

            <p>Que la bendición de Dios sea sobre tu vida.</p>
            
            <footer>
                <p>&copy; 2026 Ministerio Profético HSV</p>
            </footer>
        </div>
    </div>

</body>
</html>
